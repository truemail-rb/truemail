---

version: 2.1

defaults: &defaults
  working_directory: ~/truemail
  docker:
    - image: cimg/ruby:<< parameters.ruby-version >>

orbs:
  ruby: circleci/ruby@4.0.0

references:
  bundle_install: &bundle_install
    run:
      name: Installing gems
      command: |
            bundle config set --local path '~/vendor/bundle'
            bundle install

  install_system_dependencies: &install_system_dependencies
    run:
      name: Installing system dependencies
      command: bundle exec smtp_mock -s -i ~

  install_linters: &install_linters
    run:
      name: Installing a bunch of linters
      command: |
            curl -1sLf 'https://dl.cloudsmith.io/public/evilmartians/lefthook/setup.deb.sh' | sudo -E bash
            sudo apt-get update -y
            sudo apt-get install -y lefthook shellcheck yamllint
            npm install --prefix='~/.local' --global --save-dev git+https://github.com/streetsidesoftware/cspell-cli markdownlint-cli
            cp .circleci/linter_configs/.fasterer.yml .fasterer.yml
            cp .circleci/linter_configs/.lefthook.yml lefthook.yml

  install_codecov_cli: &install_codecov_cli
    run:
      name: Installing Codecov CLI
      command: |
            curl https://keybase.io/codecovsecops/pgp_keys.asc | gpg --no-default-keyring --keyring trustedkeys.gpg --import
            curl -Os https://cli.codecov.io/latest/linux/codecov
            curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM
            curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM.sig
            gpgv codecov.SHA256SUM.sig codecov.SHA256SUM
            shasum -a 256 -c codecov.SHA256SUM
            chmod +x codecov

  use_latest_bundler: &use_latest_bundler
    run:
      name: Using latest bundler
      command: gem install bundler

  use_latest_gemspec: &use_latest_gemspec
    run:
      name: Using latest gemspec
      command: cp .circleci/gemspecs/latest truemail.gemspec

  use_compatible_gemspec: &use_compatible_gemspec
    run:
      name: Using compatible gemspec
      command: cp .circleci/gemspecs/compatible truemail.gemspec

jobs:
  linters-ruby:
    parameters:
      ruby-version:
        type: string

    <<: *defaults

    steps:
      - checkout

      - <<: *use_latest_bundler
      - <<: *use_latest_gemspec
      - <<: *bundle_install
      - <<: *install_linters

      - run:
          name: Running commit linters
          command: lefthook run commit-linters

      - run:
          name: Running code style linters
          command: lefthook run code-style-linters

      - run:
          name: Running code performance linters
          command: lefthook run code-performance-linters

      - run:
          name: Running code vulnerability linters
          command: lefthook run code-vulnerability-linters

      - run:
          name: Running code documentation linters
          command: lefthook run code-documentation-linters

      - run:
          name: Running release linters
          command: lefthook run release-linters

  tests-ruby:
    parameters:
      ruby-version:
        type: string

    <<: *defaults

    steps:
      - checkout

      - <<: *use_latest_bundler
      - <<: *use_latest_gemspec
      - <<: *bundle_install
      - <<: *install_system_dependencies
      - <<: *install_codecov_cli

      - run:
          name: Running RSpec
          command: bundle exec rspec

      - store_artifacts:
          name: Saving Simplecov coverage artifacts
          path: ~/truemail/coverage
          destination: coverage

      - run:
          name: Uploading coverage to Codecov
          command: ./codecov upload-process --fail-on-error -f coverage/coverage.xml

  compatibility-ruby:
    parameters:
      ruby-version:
        type: string

    <<: *defaults

    steps:
      - checkout

      - <<: *use_compatible_gemspec

      - ruby/install-deps:
          bundler-version: "2.3.26"
          with-cache: false
          path: '~/vendor/custom_bundle'

      - <<: *install_system_dependencies

      - run:
          name: Running compatibility tests
          command: bundle exec rspec

  rubygems-deps-ruby:
    parameters:
      ruby-version:
        type: string

    <<: *defaults

    steps:
      - checkout

      - run:
          name: Building rubygems dependencies from default gemspec on minimal Ruby version
          command: bundle install

  releasing-gem-ruby:
    parameters:
      ruby-version:
        type: string

    <<: *defaults

    steps:
      - checkout

      - add_ssh_keys:
          fingerprints:
            - "SHA256:7lCZYwSF6mZ8xY9KodH4HAjosRcuhGD1P2lmy1obHKA"

      - run:
          name: Publishing new release
          command: ./.circleci/scripts/release.sh

workflows:
  build_test_deploy:
    jobs:
      - linters-ruby:
          matrix:
            parameters:
              ruby-version: ["4.0-node"]
      - tests-ruby:
          matrix:
            parameters:
              ruby-version: ["4.0"]
      - compatibility-ruby:
          matrix:
            parameters:
              ruby-version: ["2.5", "2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4"]
      - rubygems-deps-ruby:
          matrix:
            parameters:
              ruby-version: ["2.5"]
      - releasing-gem-ruby:
          requires:
            - linters-ruby
            - tests-ruby
            - compatibility-ruby
            - rubygems-deps-ruby
          matrix:
            parameters:
              ruby-version: ["2.5"]
          filters:
            branches:
              only: master
